name: CI

on:
  push:
    branches: [master, dev]
    tags-ignore: ["**"]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun.lock is generated by this version, and --frozen-lockfile
          # fails on a lockfile format change. Bump deliberately, not by drift.
          bun-version: 1.4.2

      # The pipeline tests spawn real ffmpeg and ffprobe rather than mocking
      # them: what they assert is faststart/moov placement and codec probing,
      # which a mock cannot tell you anything about. The runner has neither
      # binary preinstalled, so they go in here. The Dockerfile installs them
      # separately for the runtime image.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build . -t clips:ci

  # Rolling staging. Every push to dev republishes samikool/clips:dev, which
  # watchtower picks up within ~60s and deploys to dev.clips.oneroomgaming.com.
  # There is no dev tag: the image tag is fixed and simply overwritten.
  #
  # Gated on test AND build so a red dev branch cannot roll out.
  publish-dev:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: samikool/clips:dev

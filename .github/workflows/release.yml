name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun.lock is generated by this version, and --frozen-lockfile
          # fails on a lockfile format change. Bump deliberately, not by drift.
          bun-version: 1.4.2

      # The pipeline tests spawn real ffmpeg and ffprobe; the runner has
      # neither. This job gates the release, so without it a tag fails before
      # it builds anything.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      # A manual bump invites tagging v0.2.0 while package.json still says
      # 0.1.0, which would publish a mislabelled image with no warning. Fail
      # before anything is built or pushed.
      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME implies version $tag, package.json says $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Git tags keep the v (v0.1.0); image tags drop it (0.1.0), which is
      # what node, postgres and nginx all publish. Harmless if a tag has no v.
      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            samikool/clips:${{ steps.tag.outputs.version }}
            samikool/clips:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # master is a pointer to what production is running, so it only ever
      # advances to a commit that is already on dev. Pushed WITHOUT --force: a
      # direct commit to master would make this fail, which is the point. The
      # invariant is broken and a human should look, rather than have it
      # silently clobbered.
      - name: Fast-forward master to the released commit
        run: git push origin "$GITHUB_SHA:refs/heads/master"
